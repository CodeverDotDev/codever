# codever.dev production config — served by the codever-nginx container
# (docker-compose.prod.yml mounts ./nginx/conf.d → /etc/nginx/conf.d)
# Reproduces the pre-Docker bare-metal prod rules verbatim; only upstreams
# (Docker service names) and cert/webroot paths were adapted.

upstream keycloak_server {
    server keycloak:8080;        # was 127.0.0.1:8180
}

upstream node_server {
    server codever-api:3000;     # was 127.0.0.1:3000
}

# Expires map — carried over unchanged
map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;
    text/css                   max;
    application/javascript     max;
    application/font-woff2     max;
    ~image/                    30d;
}

# HTTP → HTTPS (+ ACME webroot passthrough must stay reachable over plain HTTP)
server {
    listen 80 default_server;
    server_name codever.dev www.codever.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://www.codever.dev$request_uri;
}

# apex → www for HTTPS
server {
    listen 443 ssl;
    server_name codever.dev;

    ssl_certificate     /etc/letsencrypt/live/codever.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codever.dev/privkey.pem;

    return 301 https://www.codever.dev$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name www.codever.dev;

    ssl_certificate     /etc/letsencrypt/live/codever.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codever.dev/privkey.pem;

    # TLS hardening (equivalent of the old snippets/ssl-params.conf)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    expires $expires;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA fallback — unchanged
    error_page 404 =200 /index.html;

    # gzip + header hardening carried over from old nginx.conf http{} block
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    add_header X-Frame-Options SAMEORIGIN always;
    large_client_header_buffers 8 16k;   # avoids HTTP 414 on long URIs

    # ---------------------------------------------------------------
    # Permanent 301 redirects: snippets → notes (Phase 2 migration)
    # CARRIED OVER VERBATIM — more-specific rules first
    # ---------------------------------------------------------------
    rewrite ^/snippets/([^/]+)/details$  /notes/$1/details  permanent;
    rewrite ^/snippets/([^/]+)$          /notes/$1          permanent;
    rewrite ^/my-snippets(/.*)?$         /my-notes$1        permanent;
    rewrite ^/404-snippet$               /404-note          permanent;
    # ---------------------------------------------------------------

    location / {
        try_files $uri$args $uri$args/ /index.html;
    }

    # Let's Encrypt webroot — MUST be a prefix match, not `location ~ /.well-known`:
    # a regex location outranks the /auth/ prefix location and would hijack
    # /auth/realms/bookmarks/.well-known/openid-configuration (OIDC discovery) → 500.
    # (Latent bug carried over from the old prod config — found 2026-07-31.)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # MCP OAuth protected-resource discovery must reach the API rather than the SPA.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://node_server;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---------------------------------------------------------------
    # MCP OAuth authorization-server discovery (RFC 8414 + OIDC).
    # The protected-resource document advertises the issuer
    # https://www.codever.dev/auth/realms/bookmarks. Different MCP clients build
    # the metadata URL from that issuer in different ways:
    #   - path-insertion (RFC 8414):  /.well-known/oauth-authorization-server/auth/realms/<realm>
    #   - path-insertion (OIDC):      /.well-known/openid-configuration/auth/realms/<realm>
    #   - path-append (OIDC):         /auth/realms/<realm>/.well-known/openid-configuration (via /auth/ below)
    #   - bare well-known at root:    /.well-known/oauth-authorization-server
    # Map them all to Keycloak's real OIDC discovery doc (a valid superset that
    # carries every field an OAuth client needs). Without this the path-inserted
    # form falls through to the SPA and clients get HTML → "failed to parse".
    # ---------------------------------------------------------------
    location ~ ^/\.well-known/(?:oauth-authorization-server|openid-configuration)/auth/realms/(?<kc_realm>[^/]+)/?$ {
        rewrite ^ /auth/realms/$kc_realm/.well-known/openid-configuration break;
        proxy_pass http://keycloak_server;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
    }
    location = /.well-known/oauth-authorization-server {
        rewrite ^ /auth/realms/bookmarks/.well-known/openid-configuration break;
        proxy_pass http://keycloak_server;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
    }
    location = /.well-known/openid-configuration {
        rewrite ^ /auth/realms/bookmarks/.well-known/openid-configuration break;
        proxy_pass http://keycloak_server;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
    }

    location /auth/ {
        proxy_pass http://keycloak_server;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   $server_port;
        # enlarged buffers — avoids bad gateway when the Chrome extension
        # posts bookmarks with large descriptions (carried over unchanged)
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://node_server/api/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Streamable HTTP MCP traffic must not be buffered by nginx.
    location /api/mcp {
        proxy_pass http://node_server;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}

