# Keycloak 24 Account Console v2 (React SPA). Extend the built-in keycloak.v2 theme and only
# override the branding. The OLD v1 theme (parent=keycloak, import=common/keycloak,
# styles=css/account.css css/logo.css with a .navbar-title background) is the deprecated
# FreeMarker console and does NOT style this page - see
# documentation/requirements/migrate-to-docker/account-theme-codever.md.
parent=keycloak.v2

# Top-left header logo + its link target. The account-ui loads the logo from the theme's
# resources/public/ folder (served at /auth/resources/<hash>/account/codever/public/...).
# The Codever logo asset is at resources/public/logo.png.
logo=/logo.png
logoUrl=https://www.codever.dev
