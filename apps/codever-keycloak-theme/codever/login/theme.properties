parent=keycloak
import=common/keycloak

# Keycloak 24 (Quarkus): the parent 'keycloak' theme declares styles=css/login.css and loads
# PatternFly via stylesCommon (inherited). A child theme overriding 'styles' must repeat the
# parent's css/login.css and append its own overrides (logo).
# (Old WildFly/KC16 list 'node_modules/patternfly/... lib/zocial/zocial.css' no longer exists.)
styles=css/login.css css/logo.css

kcLogoLink=https://www.codever.dev
