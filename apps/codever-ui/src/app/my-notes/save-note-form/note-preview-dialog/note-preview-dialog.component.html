<div class="p-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">{{ dialogTitle || 'Preview' }}</h5>
    <button
      type="button"
      class="close"
      aria-label="Close"
      (click)="close()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <hr class="mt-1 mb-2" />
  <!-- Notebook rendering -->
  <div *ngIf="isNotebook; else markdownPreview">
    <app-notebook-renderer [ipynbJson]="notebookJson"></app-notebook-renderer>
  </div>
  <!-- Markdown rendering -->
  <ng-template #markdownPreview>
    <div
      class="markdown-preview p-3 border rounded bg-light"
      [innerHTML]="renderedContent"
    ></div>
  </ng-template>
</div>
