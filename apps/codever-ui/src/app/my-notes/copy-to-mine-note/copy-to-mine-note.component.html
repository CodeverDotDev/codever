@if (note) {
  <app-note-editor [note]="note"
    [isEditMode]="false"
    [cloneNote]="true"
    [copyToMine]="true"
   />
} @else if (loadFailed) {
  <div class="alert alert-warning copy-unavailable" role="status">
    <p class="mb-1">This note is not available to copy here.</p>
    <p class="mb-0">
      If it was shared with you, open the sharing link again and choose
      "Copy to mine". Go to <a routerLink="/dashboard/notes">my notes</a>.
    </p>
  </div>
} @else {
  <p role="status">Loading note…</p>
}
