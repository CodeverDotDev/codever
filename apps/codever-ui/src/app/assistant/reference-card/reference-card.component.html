<div class="assistant-reference-card">
  <div class="ref-header">
    <span class="ref-type-badge" [class.note]="isNote" [class.bookmark]="!isNote">
      <i class="fas" [class.fa-sticky-note]="isNote" [class.fa-bookmark]="!isNote"></i>
      {{ reference.type }}
    </span>
  </div>

  @if (isNote) {
    <a
      class="ref-title"
      [routerLink]="['/my-notes', reference.id, 'details']"
      [title]="reference.title"
      >
      {{ reference.title || '(untitled)' }}
    </a>
  }

  @if (!isNote) {
    <a
      class="ref-title"
      [href]="reference.url"
      target="_blank"
      rel="noopener noreferrer"
      [title]="reference.url"
      >
      {{ reference.title || reference.url }}
    </a>
  }

  @if (reference.excerpt) {
    <p class="ref-excerpt">{{ reference.excerpt }}</p>
  }
</div>
