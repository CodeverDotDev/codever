

<div #noteContentDiv appMarkedImageWidth appCopyCodeButton appFullscreenCodeButton
  [style.fontSize.%]="contentFontSize"
  [attr.data-content-font-size]="contentFontSize">
  <div [ngClass]="{
    more_text: showMoreText || !partOfList || isFullScreen,
    less_text_note: partOfList && viewHeight > maxNoteHeightInList && !isFullScreen && !showMoreText
  }">
    @if (note.contentType === 'notebook') {
      <app-notebook-renderer [ipynbJson]="note.notebookContent" />
    } @else {
      <p [innerHtml]="note.content | md2html"></p>
    }
    <app-entry-copyable-info [fields]="note.copyableFields" [origin]="note.origin" />
  </div>
  @if (partOfList && viewHeight > maxNoteHeightInList && !isFullScreen) {
    <button type="button" (click)="showMoreText = !showMoreText"
      [ngClass]="{ show_less_button: showMoreText, show_more_button: !showMoreText }"
      class="toggle-show-more-button"
      [attr.aria-expanded]="showMoreText"
      [attr.aria-label]="showMoreText ? 'Show less' : 'Show more'"
      [title]="showMoreText ? 'Show less' : 'Show more'"></button>
  }
</div>
