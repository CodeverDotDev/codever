<div *ngIf="note$ | async as note" class="note-details-wrapper">
  <div class="note-details-main">
    <div class="card" #noteEntry>
      <div class="card-body show-hide note-container"
           [ngClass]="note.public ? 'note-public-bg' : 'note-bg'">
    <div class="header-wrapper">
      <div class="title-and-subtitle">
        <h5 class="card-title">
          <i class="fa fa-sticky-note fa-xs mr-2 anthracite-gray"></i>
          <ng-container *ngIf="partOfList; else plainTitle">
            <a *ngIf="(userId$ | async) === note.userId; else publicNoteLink"
               [routerLink]="['/my-notes', note._id, 'details']"
               [innerHtml]="note.title | highlight : queryText">
            </a>
            <ng-template #publicNoteLink>
              <a [routerLink]="['/notes', note._id, 'details']"
                 [innerHtml]="note.title | highlight : queryText">
              </a>
            </ng-template>
          </ng-container>
          <ng-template #plainTitle>{{ note.title }}</ng-template>
          <span *ngIf="note.public"
                class="badge badge-pill ml-2 font-weight-normal"
                style="background-color:#81c784; color:#1b5e20; font-size:0.7rem; vertical-align:middle;"
                title="Public note">
            <i class="fas fa-eye mr-1"></i>Public
          </span>
          <span *ngIf="!note.public"
                class="badge badge-pill ml-2 font-weight-normal"
                style="background-color:#fff9c4; color:#795548; border:1px solid #f0cc70; font-size:0.7rem; vertical-align:middle;"
                title="Private note">
            <i class="fas fa-eye-slash mr-1"></i>Private
          </span>
        </h5>
        <h6 class="card-subtitle mb-2 text-muted url-under-title">
      <span title="last updated">
        <i class="far fa-calendar-alt"></i>  {{ note.updatedAt | date : 'yyyy-MM-dd' }}
      </span>
          <span *ngIf="note.reference"
          ><strong> - ref</strong>:
        <span
          *ngIf="
            note.reference.startsWith('http:') ||
              note.reference.startsWith('https:');
            else justText
          "
        >
          <a href="{{ note.reference }}" target="_blank" title="{{ note.reference }}">
            {{
            note.reference.length > 55
              ? note.reference.substring(0, 55) + '...'
              : note.reference
            }}
          </a>
          <sup class="ml-1"><i class="fas fa-external-link-alt"></i></sup>
        </span>
        <ng-template #justText>
          <span>{{ note.reference }}</span>
        </ng-template>
      </span>
        </h6>
      </div>
      <div class="cursor-pointer d-flex align-items-center" style="gap: 0.5rem;">
        <span
          *ngIf="(note$ | async)?.contentType !== 'notebook'"
          class="note-action-btn"
          title="Copy markdown content"
          (click)="copyNoteMarkdown(note)"
        >
          <i class="far fa-copy fa-lg"></i><span *ngIf="markdownCopied" class="ml-1" style="font-size:0.85rem;">Copied</span>
        </span>
        <span class="note-action-btn" title="Toggle Fullscreen" (click)="toggleFullScreen(noteEntry)">
          <i *ngIf="!isFullScreen" class="fas fa-expand fa-lg"></i>
          <i *ngIf="isFullScreen" class="fas fa-compress fa-lg"></i>
        </span>
      </div>
    </div>

    <hr class="title-content-separator"/>
    <div class="zoom-bar">
      <span class="zoom-group">
        <span class="note-action-btn zoom-btn" title="Zoom out" (click)="zoomOut()">
          <i class="fas fa-search-minus"></i>
        </span>
        <span class="zoom-indicator" title="Zoom level">{{ contentFontSize }}%</span>
        <span class="note-action-btn zoom-btn" title="Zoom in" (click)="zoomIn()">
          <i class="fas fa-search-plus"></i>
        </span>
      </span>
    </div>
    <div [ngClass]="{'scrollable-div-fullscreen': isFullScreen}">
      <app-note-content [note]="note" [queryText]="queryText" [partOfList]="partOfList" [isFullScreen]="isFullScreen" [contentFontSize]="contentFontSize"></app-note-content>
    </div>
  </div>

  <ng-container *ngIf="{ userId: userId$ | async } as observables">
    <div class="card-footer" style="padding-right: 0.3rem">
      <div class="tags-group">
        <div class="input-group-sm mb-2 mb-sm-0 star-group">
        </div>
      <div *ngFor="let tag of note.tags" class="btn-group tag-list mr-2 mt-1">
        <!-- Own note (logged in): search My Notes with just the tag -->
        <a
          *ngIf="observables.userId && observables.userId === note.userId; else publicTagLink"
          class="badge badge-secondary float-xs-left pr-2 font-weight-bolder"
          [routerLink]="['/search']"
          [queryParams]="{ q: '[' + tag + ']', sd: 'all-mine', type: 'note' }"
          title="Search my notes tagged [{{ tag }}]"
          [innerHtml]="tag | highlight : queryText"
        ></a>
        <!-- Not logged in OR someone else's note: search Public Notes with just the tag -->
        <ng-template #publicTagLink>
          <a
            class="badge badge-secondary float-xs-left pr-2 font-weight-bolder"
            [routerLink]="['/search']"
            [queryParams]="{ q: '[' + tag + ']', sd: 'public-notes' }"
            title="Search public notes tagged [{{ tag }}]"
            [innerHtml]="tag | highlight : queryText"
          ></a>
        </ng-template>
      </div>
      <div class="float-right mt-1">
        <button
          *ngIf="observables.userId && note.userId === observables.userId"
          type="button"
          class="btn btn-light btn-sm"
          (click)="editNote(note)"
          title="Edit note"
        >
          <i class="far fa-edit"></i> Edit
        </button>
        <button
          *ngIf="observables.userId && note.userId === observables.userId"
          type="button"
          class="btn btn-light btn-sm"
          (click)="cloneNote(note)"
          title="Clone note"
        >
          <i class="far fa-clone"></i> Clone
        </button>
        <button
          *ngIf="note.public && note.userId !== observables.userId"
          type="button"
          class="btn btn-light btn-sm"
          (click)="copyToMine(note)"
          title="Save a copy to my notes"
        >
          <i class="far fa-copy"></i> Copy to mine
        </button>
        <button
          *ngIf="note.public || (!note.public && note.userId === observables.userId)"
          class="btn btn-light btn-sm float-right"
          title="Share via email or on social media"
          (click)="shareNoteDialog(note, observables.userId)"
        >
          <i class="fas fa-share"></i>
          Share
        </button>
        <button
          *ngIf="observables.userId && (note.userId === observables.userId || note.public)"
          class="btn btn-light btn-sm float-right mr-1"
          title="Add to collection"
          (click)="openAddToCollectionDialog(note, observables.userId)"
        >
          <i class="fas fa-layer-group"></i> Collect
        </button>
      </div>
    </div>
    </div>
  </ng-container>
    </div>
  </div>
  <aside class="note-details-toc" *ngIf="!partOfList">
    <app-note-toc [headings]="tocHeadings"></app-note-toc>
  </aside>
</div>
