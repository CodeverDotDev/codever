<div #bookmarkText (click)="addToHistoryWhenClickOnLink($event)" (auxclick)="addToHistoryWhenMiddleClickOnLink($event)"
  appOpenInNewTab>
  <div [ngClass]="{ more_text: showMoreText, less_text_bookmark: viewHeight > 120 && !showMoreText }">
    @if (bookmark.descriptionHtml) {
      <div
        [innerHtml]="bookmark.descriptionHtml | highlightHtml : queryText"
      ></div>
    }
    <app-entry-copyable-info [fields]="bookmark.copyableFields" />
  </div>
  @if (viewHeight > 120) {
    <button type="button" (click)="showMoreText = !showMoreText"
      [ngClass]="{ show_less_button: showMoreText, show_more_button: !showMoreText }"
      class="toggle-show-more-button"
      [attr.aria-expanded]="showMoreText"
      [attr.aria-label]="showMoreText ? 'Show less' : 'Show more'"
      [title]="showMoreText ? 'Show less' : 'Show more'"></button>
  }
</div>
