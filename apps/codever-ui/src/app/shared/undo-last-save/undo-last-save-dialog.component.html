<h2 mat-dialog-title>Undo last save</h2>

<hr />

<mat-dialog-content>
  @if (data.entryTitle) {
    <p>
      <strong>"{{ data.entryTitle }}"</strong>
    </p>
  }
  <p>
    The changes of your last save will be discarded and the version from
    before it restored. This cannot be undone.
  </p>
  <p class="mb-0">Undo the last save?</p>
</mat-dialog-content>

<hr />

<mat-dialog-actions class="app-dialog-actions">
  <button
    type="button"
    class="btn btn-primary btn-sm me-2"
    (click)="confirm()"
  >
    Undo save
  </button>
  <button type="button" class="btn btn-secondary btn-sm" (click)="close()">
    Cancel
  </button>
</mat-dialog-actions>
