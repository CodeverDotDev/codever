@if (searchResults$ | async; as searchResults) {
  <div class="mt-3">
    @if (showFilterBox) {
      <div
        class="mb-3 has-search float-end filter-box"
        >
        <span class="fas fa-filter form-control-feedback"></span>
        <input
          type="search"
          [(ngModel)]="filterText"
          class="form-control"
          placeholder="Filter..."
          data-test="search-results-input-filter"
          />
      </div>
    }
    <div class="clear"></div>
    @for (searchResult of searchResults | resourceFilter : filterText; track searchResult) {
      <div
        class="mt-3"
        >
        @if (isBookmark(searchResult)) {
          <app-bookmark-list-element [bookmark]="searchResult"
            [userData$]="userData$"
            [queryText]="queryText"
            [filterText]="filterText"
            [isSearchResultsPage]="isSearchResultsPage"
             />
        }
        @if (isNote(searchResult)) {
          <app-note-details [note$]="of(searchResult)"
            [queryText]="queryText"
            [inSearchResults]="true"
            [partOfList]="true"
           />
        }
      </div>
    }
    <app-page-navigation-bar [showPagination]="showPagination"
      [results]="searchResults"
      [currentPage]="currentPage"
      [callerPagination]="callerPagination"
     />
  </div>
}
