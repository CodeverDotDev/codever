<h2 mat-dialog-title>
  <i class="fas fa-layer-group me-2"></i>Add to Collection
</h2>
<mat-dialog-content>
  @if (loading) {
    <div class="text-center py-3">
      <i class="fas fa-spinner fa-spin fa-lg"></i>
    </div>
  }

  @if (!loading) {
    <div>
      <!-- Create new collection inline -->
      <div class="mb-3">
        @if (!showCreateForm) {
          <button
            class="btn btn-outline-primary btn-sm"
            (click)="showCreateForm = true"
            >
            <i class="fas fa-plus me-1"></i> Create new collection
          </button>
        }
        @if (showCreateForm) {
          <div class="d-flex">
            <input
              type="text"
              class="form-control form-control-sm me-2"
              [(ngModel)]="newCollectionName"
              placeholder="Collection name"
              (keyup.enter)="createNewCollection()"
              autofocus
              />
            <button
              class="btn btn-primary btn-sm me-1"
              [disabled]="!newCollectionName.trim()"
              (click)="createNewCollection()"
              >
              <i class="fas fa-check"></i>
            </button>
            <button
              class="btn btn-light btn-sm"
              (click)="showCreateForm = false; newCollectionName = ''"
              >
              <i class="fas fa-times"></i>
            </button>
          </div>
        }
      </div>
      <!-- Filter -->
      @if (collections.length > 5) {
        <div class="mb-2">
          <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Filter collections..."
            [(ngModel)]="filterText"
            />
        </div>
      }
      <!-- Collections list -->
      <div class="collections-checklist">
        @for (collection of filteredCollections; track collection) {
          <div
            class="form-check collection-check-item py-1"
            >
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'col-' + collection._id"
              [checked]="isSelected(collection._id)"
              (change)="toggleCollection(collection)"
              />
            <label class="form-check-label" [for]="'col-' + collection._id">
              <i class="fas fa-folder me-1" [style.color]="collection.color || '#6c757d'"></i>
              {{ collection.name }}
              <small class="text-body-secondary ms-1">({{ collection.items?.length || 0 }})</small>
            </label>
          </div>
        }
        @if (filteredCollections.length === 0) {
          <div class="text-body-secondary small py-2">
            No collections found.
          </div>
        }
      </div>
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="btn btn-secondary btn-sm" (click)="close()">Done</button>
</mat-dialog-actions>
