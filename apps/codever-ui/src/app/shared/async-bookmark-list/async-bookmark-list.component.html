@if (bookmarks$ | async; as bookmarks) {
<div class="mt-3" data-test="bookmarks-list-wrapper">
  @if (showFilterBox) {
  <div class="mb-3 has-search float-end filter-box">
    <span class="fas fa-filter form-control-feedback"></span>
    <input
      autofocus
      type="search"
      [(ngModel)]="filterText"
      class="form-control"
      placeholder="Filter..."
      data-test="bookmarks-search-results-input-filter"
    />
  </div>
  }
  <div class="clear"></div>
  @for (
    bookmark of bookmarks | resourceFilter : filterText;
    track bookmark._id;
    let filteredCount = $count
  ) {
  <div class="mt-3">
    <app-bookmark-list-element
      [showMoreText]="filteredCount === 1 || bookmarks.length === 1"
      [bookmark]="bookmark"
      [userData$]="userData$"
      [queryText]="queryText"
      [filterText]="filterText"
      [isSearchResultsPage]="isSearchResultsPage"
    />
  </div>
  }
  <app-page-navigation-bar
    [showPagination]="showPagination"
    [results]="bookmarks"
    [currentPage]="currentPage"
    [callerPagination]="callerPagination"
  />
</div>
}
