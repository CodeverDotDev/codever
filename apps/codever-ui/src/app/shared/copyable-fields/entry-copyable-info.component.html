@for (section of sections; track section.title) {
  @if (section.fields.length) {
    <section class="my-3 copyable-fields-section">
      <h3 class="fs-6">{{ section.title }}</h3>
      <dl class="mb-0">
        @for (field of section.fields; track $index) {
          <div class="copyable-row">
            <dt>{{ field.label }}</dt>
            <dd class="mb-0">
              <span class="copyable-value"><code>{{ field.value }}</code>
                <button type="button" class="btn btn-sm btn-outline-secondary copy-button"
                  [attr.aria-label]="copiedField === field ? field.label + ' copied' : 'Copy ' + field.label"
                  [title]="copiedField === field ? field.label + ' copied' : 'Copy ' + field.label"
                  (click)="copy(field)">
                  <i class="far fa-copy" aria-hidden="true"></i>
                  @if (copiedField === field) {
                    <span class="ms-1 copy-status">Copied</span>
                  }
                </button>
              </span>
            </dd>
          </div>
        }
      </dl>
    </section>
  }
}
<span role="status" aria-live="polite">{{ feedback }}</span>
