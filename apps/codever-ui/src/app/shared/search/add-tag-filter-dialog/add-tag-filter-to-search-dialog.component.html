<h2 mat-dialog-title>Select tag(s) to add to search query</h2>

<hr/>

<mat-form-field class="example-chip-list">
  <mat-label>{{ tagsLabel }}</mat-label>
  <mat-chip-grid #chipList aria-label="Tag selection">
    @for (tag of tags; track tag) {
      <mat-chip-row
        [removable]="removable"
        (removed)="remove(tag)"
        >
        {{ tag.name }}
        @if (removable) {
          <mat-icon matChipRemove>cancel</mat-icon>
        }
      </mat-chip-row>
    }
    <input
      placeholder="Type to filter..."
      #tagInput
      [formControl]="tagCtrl"
      [matAutocomplete]="auto"
      [matChipInputFor]="chipList"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="add($event)"
      />
  </mat-chip-grid>
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
    @for (tag of filteredTags | async; track tag) {
      <mat-option [value]="tag">
        {{ tag.name }} <span class="badge bg-light">{{ tag.count }}</span>
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>

<mat-dialog-actions class="app-dialog-actions">
  <button
    type="button"
    [disabled]="tags.length == 0"
    class="btn btn-primary btn-sm me-2"
    (click)="addTagsToSearch()"
    >
    Add tags to search query
  </button>
  <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">
    Cancel
  </button>
</mat-dialog-actions>
