@if (notes$ | async; as notes) {
  <div class="mt-2">
    @for (note of visibleNotes(notes); track note) {
      <div>
        <app-note-details [note$]="of(note)"
          (noteDeleted)="onNoteDeleted($event)"
          [queryText]="queryText"
          [inSearchResults]="true"
          [partOfList]="true"
          [showMoreText]="visibleNotes(notes).length === 1"
         />
      </div>
    }
    <app-page-navigation-bar [showPagination]="showPagination"
      [results]="notes"
      [currentPage]="currentPage"
      [callerPagination]="callerPagination"
     />
  </div>
}
