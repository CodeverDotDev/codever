@if (notes$ | async; as notes) {
  <div class="mt-2">
    @for (note of notes; track note) {
      <div>
        <app-note-details [note$]="of(note)"
          [queryText]="queryText"
          [inSearchResults]="true"
          [partOfList]="true"
         />
      </div>
    }
    <app-page-navigation-bar [showPagination]="showPagination"
      [results]="notes"
      [currentPage]="currentPage"
      [callerPagination]="callerPagination"
     />
  </div>
}
