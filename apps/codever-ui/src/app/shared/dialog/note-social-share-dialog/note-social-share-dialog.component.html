@if (note.public) {
  <h2 mat-dialog-title>Share <b>public</b> note</h2>
  <app-note-social-share-dialog-content [note]="note"
    [shareableUrl]="environment.HOST + '/notes/' + note._id"
     />
} @else {
  <h2 mat-dialog-title>
    <i class="fas fa-eye-slash"></i> Share <b>private</b> note
  </h2>
  @if ((shareableId$ | async)?.shareableId; as shareableId) {
    <app-note-social-share-dialog-content [note]="note"
      [shareableUrl]="environment.HOST + '/notes/shared/' + shareableId"
       />
  }
}

<mat-dialog-actions class="app-dialog-actions" align="end">
  <button type="button" class="btn btn-primary" (click)="close()">Close</button>
</mat-dialog-actions>
