<mat-dialog-content class="social-share-dialog-content">
  <div class="share-buttons-wrapper">
    <div class="row">
      @if (shareableUrl) {
        <div class="col">
          <a
            type="button"
            class="btn btn-light btn-sm"
            title="Copy note link"
            (click)="copyToClipboard(shareableUrl)"
          >
            <i class="far fa-copy" style="font-size: smaller"></i>
            {{ copyLinkButtonText }}
          </a>
        </div>
        @if (note.public) {
          <div class="col">
            <button
              type="button"
              class="btn btn-light btn-sm"
              title="Copy title, tags and link"
              (click)="copyWithDetails()"
            >
              <i class="far fa-copy" style="font-size: smaller"></i>
              {{ copyDetailsButtonText }}
            </button>
          </div>
        }
        <div class="col">
          <a
            type="button"
            class="btn btn-light btn-sm"
            href="mailto:?subject={{ note.title + ' via Codever' }}&body={{ shareableUrl }}"
            title="Share link via Email"
          >
            <i class="far fa-envelope"></i> Email
          </a>
        </div>
      }
      @if (note.public) {
        <div class="col">
          <tweet [url]="shareableUrl" [text]="tweetText" [hashTags]="tagsStr" />
        </div>
      }
    </div>
    <div class="clear"></div>
    @if (copyDetailsError) {
      <div class="alert alert-danger mt-2" role="alert">
        {{ copyDetailsError }}
      </div>
    }
  </div>
</mat-dialog-content>
