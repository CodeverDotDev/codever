<div class="dialog-title">
  <h2 mat-dialog-title [innerHTML]="title"></h2>
  <div class="form-group has-search">
    <span class="fas fa-filter form-control-feedback"></span>
    <input
      type="search"
      [(ngModel)]="filterText"
      class="form-control"
      placeholder="Filter by title"
    />
  </div>
</div>
<mat-dialog-content
  *ngIf="userDataResources$ | async as userDataResources"
  class="mt-2 pt-1 pb-1"
>
  <mat-accordion>
    <mat-expansion-panel
      *ngFor="
        let userDataResource of userDataResources
          | resourceTitleFilter : filterText as filteredResources;
        index as i
      "
      [expanded]="filteredResources.length === 1"
    >
      <!--
        `mat-expansion-panel-header` and `ng-template[matExpansionPanelContent]`
        MUST stay direct children of `mat-expansion-panel`: the panel projects
        its header via `ng-content select="mat-expansion-panel-header"`, which
        only matches direct lexical children. Wrapping them in per-type
        `*ngIf`/`ng-template` branches breaks the projection and the panel
        renders empty (the bug that hid every entry). The note/bookmark
        distinction is switched INSIDE the header and the lazy content instead.
      -->
      <mat-expansion-panel-header *ngIf="i < 15">
        <div class="p-3">
          <!-- NOTE header -->
          <ng-container *ngIf="isNote(userDataResource); else bookmarkHeader">
            <h5 class="card-title">
              <i class="fa fa-sticky-note fa-xs mr-2 anthracite-gray"></i>
              <a
                [routerLink]="noteDetailsLink(userDataResource)"
                [mat-dialog-close]="true"
                [innerHTML]="
                  userDataResource.title | slice : 0 : 100 | highlightHtml : filterText
                "
              >
                {{ 'see innerhtml' }}
              </a>
            </h5>
            <h6 class="card-subtitle mb-2 text-muted url-under-title">
              <i class="far fa-calendar-alt"></i>
              {{ userDataResource.updatedAt | date : 'yyyy-MM-dd' }}
            </h6>
          </ng-container>

          <!-- BOOKMARK header -->
          <ng-template #bookmarkHeader>
            <h5 class="card-title">
              <a
                href="{{ userDataResource.location }}"
                [innerHTML]="
                  userDataResource.name | slice : 0 : 100 | highlightHtml : filterText
                "
                target="_blank"
                (click)="
                  addToHistoryService.promoteInHistoryIfLoggedIn(true, userDataResource)
                "
                (auxclick)="
                  addToHistoryService.onMiddleClickInDescription(
                    true,
                    $event,
                    userDataResource
                  )
                "
              >
                {{ 'see innerhtml' }}
              </a>
              <sup class="external-link-hint"
                ><i class="fas fa-external-link-alt"></i
              ></sup>
            </h5>
            <h6
              class="card-subtitle mb-2 text-muted url-under-title"
              [innerHTML]="
                userDataResource.location | slice : 0 : 120 | highlightHtml : filterText
              "
            >
              {{ 'see innerhtml' }}
            </h6>
          </ng-template>
        </div>
      </mat-expansion-panel-header>

      <ng-template matExpansionPanelContent>
        <!-- NOTE content -->
        <app-note-content
          *ngIf="isNote(userDataResource); else bookmarkContent"
          [note]="userDataResource"
          [partOfList]="true"
        ></app-note-content>

        <!-- BOOKMARK content -->
        <ng-template #bookmarkContent>
          <app-bookmark-text
            [bookmark]="userDataResource"
            [showMoreText]="true"
            (click)="
              addToHistoryService.onClickInDescription(true, $event, userDataResource)
            "
            (auxclick)="
              addToHistoryService.onMiddleClickInDescription(
                true,
                $event,
                userDataResource
              )
            "
          >
          </app-bookmark-text>
        </ng-template>
      </ng-template>
    </mat-expansion-panel>
  </mat-accordion>
</mat-dialog-content>
