@if (bookmark$ | async; as bookmark) {
  <div>
    <app-bookmark-list-element [bookmark]="bookmark"
      [userData$]="userData$"
      [isDetailsPage]="true"
      [showMoreText]="popup ? false : true"
    />
    <div class="container">
      <div class="row">
        <div class="col text-center">
          @if (popup) {
            <button
              class="btn btn-lg btn-primary mt-2 mb-2"
              (click)="closeDialog()"
              >
              Close Window <i class="fas fa-window-close"></i>
            </button>
          }
        </div>
      </div>
    </div>
  </div>
}
