<div *ngIf="userData$ | async as userData" class="mt-3 p-1">

  <h4 class="mt-2">
    <i class="fas fa-xs fa-history mr-1"></i> Recent searches
  </h4>

  <div class="mt-2">
    <ng-container *ngFor="let mySearch of recentSearches(userData)">
      <span class="mt-1 mr-2 d-inline-block">
        <a
          [routerLink]="['/search']"
          [queryParams]="{ q: mySearch.text, sd: mySearch.searchDomain }"
          class="badge badge-secondary mb-1"
          [class.my-bookmarks-last-search]="mySearch.searchDomain === 'my-bookmarks'"
          [class.my-notes-last-search]="mySearch.searchDomain === 'my-notes'"
          [class.public-notes-last-search]="mySearch.searchDomain === 'public-notes'"
          [class.public-bookmarks-last-search]="mySearch.searchDomain === 'public-bookmarks'"
          title="{{ 'Search in ' + mySearch.searchDomain + ': ' + mySearch.text }}"
        >
          <i class="fa fa-xs fa-search mr-1"></i>
          {{ mySearch.text }}
          <i
            *ngIf="mySearch.searchDomain === 'my-bookmarks' || mySearch.searchDomain === 'public-bookmarks'"
            class="fa fa-xs fa-bookmark ml-1"
          ></i>
          <i
            *ngIf="mySearch.searchDomain === 'my-notes' || mySearch.searchDomain === 'public-notes'"
            class="fa fa-xs fa-sticky-note ml-1"
          ></i>
          <span *ngIf="mySearch.searchDomain === 'all-mine'">
            <i class="fa fa-xs fa-bookmark ml-1"></i>
            <i class="fa fa-xs fa-sticky-note ml-1"></i>
          </span>
        </a>
      </span>
    </ng-container>
    <p *ngIf="recentSearches(userData).length === 0" class="text-muted">No recent searches yet.</p>
  </div>

  <h5 class="text-danger mt-4">Danger zone</h5>
  <div class="border border-danger rounded-lg" style="padding: 1rem">
    <h6>Delete <strong>saved search</strong></h6>
    <div class="input-group search-component">
      <div class="input-group-prepend">
        <span class="input-group-text">
          <i class="fa fa-search"></i>
        </span>
        <button
          type="button"
          class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split"
          data-toggle="dropdown"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span class="sr-only">Toggle Dropdown</span>
        </button>
        <div class="dropdown-menu">
          <a
            class="dropdown-item"
            role="button"
            title="Search in personal bookmarks"
            (click)="onSearchDomainChange('my-bookmarks')"
          >
            <i class="fas fa-xs fa-bookmark mr-1"></i> My Bookmarks
            <i *ngIf="searchDomain === 'my-bookmarks'" class="fas fa-check"></i>
          </a>
          <a
            class="dropdown-item"
            role="button"
            title="Search in public bookmarks"
            (click)="onSearchDomainChange('public-bookmarks')"
          >
            <i class="fas fa-xs fa-bookmark mr-1"></i> Public Bookmarks
            <i *ngIf="searchDomain === 'public-bookmarks'" class="fas fa-check"></i>
          </a>
          <div class="dropdown-divider"></div>
          <a
            class="dropdown-item"
            role="button"
            title="Search in my notes"
            (click)="onSearchDomainChange('my-notes')"
          >
            <i class="fas fa-xs fa-sticky-note mr-1"></i> My Notes
            <i *ngIf="searchDomain === 'my-notes'" class="fas fa-check"></i>
          </a>
        </div>
      </div>
      <input
        #tagSearchBox
        type="text"
        class="form-control"
        [formControl]="selectSavedSearchControl"
        placeholder="Start typing to select saved search for {{ searchDomains.get(searchDomain) }}"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete #auto="matAutocomplete">
        <mat-option *ngFor="let search of filteredSearches | async" [value]="search.text">
          {{ search.text }}
        </mat-option>
      </mat-autocomplete>
      <div class="input-group-append">
        <button
          class="btn btn-outline-danger"
          type="button"
          (click)="openDeleteDialog(tagSearchBox.value)"
          [disabled]="!buttonEnabled"
        >
          Delete <strong>saved search</strong>
        </button>
      </div>
    </div>
  </div>

</div>
