@if (bookmark$ | async; as bookmark) {
  <div>
    <app-bookmark-list-element [bookmark]="bookmark"
      [isDetailsPage]="true"
      [showMoreText]="true"
       />
    <div class="text-center">
      <small class="text-body-secondary d-block mb-2">
        Press <kbd>k</kbd> <kbd>k</kbd> to open this bookmark's main link in a
        new tab
      </small>
    </div>
  </div>
}
